<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기사 무기 동작 확인</title><style>
*{box-sizing:border-box}body{margin:0;background:#172027;color:#eee;font:15px system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}p{color:#bac8d1;line-height:1.6}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:16px;background:#26323b;border:1px solid #42535f;border-radius:10px}label{display:grid;gap:6px;font-size:13px}select,button{font:inherit;border:1px solid #6e838f;background:#18242e;color:#fff;padding:9px;border-radius:6px;max-width:240px}button{align-self:end;cursor:pointer}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#34424c;border:1px solid #60727c;border-radius:8px}.strip{overflow:auto;margin:20px 0}.strip canvas{width:auto;max-width:none;border-radius:0}a{color:#b1d3f2}#status{min-height:24px;font-size:13px}small{display:block;color:#becbd3;margin:12px 0}</style></head><body><main>
<h1>기사 무기·방패 동작 확인</h1><p>남녀 기사의 맨손과 착용 상태를 같은 프레임으로 비교합니다. 무기를 바꿔도 걷기와 공격 내내 같은 장비를 사용합니다.</p>
<div class="controls"><label>무기<select id="weapon"></select></label><label>방패<select id="shield"></select></label><label>동작<select id="action"><option value="walk">걷기</option><option value="normal" selected>일반 공격</option><option value="skill">스킬 공격</option><option value="shield_bash">방패 강타</option><option value="idle">대기</option></select></label><label>방향<select id="direction"></select></label><label>재생 속도<select id="speed"><option value="0.5">느리게</option><option value="1" selected>기본</option></select></label><button id="pause">일시정지</button><button id="next">다음 프레임</button></div>
<p id="status" role="status">그림을 불러오고 있습니다.</p><canvas id="stage" width="1200" height="380" aria-label="남녀 기사 맨손과 착용 동작 비교"></canvas><small>왼쪽부터 남기사 맨손 · 남기사 착용 · 여기사 맨손 · 여기사 착용</small>
<div class="strip"><canvas id="frames" width="1280" height="400" aria-label="남녀 기사 전체 동작 프레임"></canvas></div><a href="../">게임으로 돌아가기</a>
<script type="module" src="knight-motion-review.js"></script></main></body></html>
