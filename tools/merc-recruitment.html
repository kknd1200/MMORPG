<!doctype html><html lang="ko"><meta charset="utf-8"><title>용병 고용 확인</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#20281f}#hud .panel[data-panel=npc]{display:flex;transform:none;left:20px;top:65px;width:560px;max-height:calc(100% - 100px)}#controls{position:fixed;top:15px;left:20px;z-index:999;display:flex;gap:10px}#result{position:fixed;top:70px;left:610px;width:500px;color:#fff}#log{padding:15px;color:#ffd67d}.member{display:flex;align-items:center;gap:15px;margin:15px}</style><div id="controls"><button id="hour">1시간 경과</button><button id="poor">골드 99로 설정</button><button id="gold">골드 1,000으로 설정</button><button id="reload">저장 후 재접속</button></div><div id="hud"><section class="panel show" data-panel="npc"><header>용병단장 · 기능 확인</header><div class="body"></div></section><div class="item-overlay" hidden><section class="item-dialog" role="dialog" aria-modal="true" tabindex="-1"></section></div></div><aside id="result"><h3>고용한 파티원</h3><div id="members"></div><div id="log"></div><div id="persist"></div></aside><script type="module">
import {Hud} from '../js/game/hud.js';import {Game} from '../js/game/game.js';import {preloadHeroArt} from '../js/game/hero-sheets.js';import {avatarMarkup,paintAvatars} from '../js/ui/portraits.js';
await preloadHeroArt();let hour=100,saved;const g=Object.create(Game.prototype);Object.assign(g,{char:{name:'대표',gold:1000,level:10,party:[]},player:{x:0,y:0,dead:false},party:[],world:{def:{id:'town1',type:'village',level:[5,10]}},openNpc:{kind:'mercenary'},now:()=>hour*3600000,units(){return [{char:this.char},...this.party]},preloadUnit(){},fx(){},log(text){document.querySelector('#log').textContent=text},save(){saved=JSON.parse(JSON.stringify(this.char));document.querySelector('#persist').textContent='저장 완료'}});
const hud=Object.create(Hud.prototype);Object.assign(hud,{root:document.querySelector('#hud'),game:g,open:new Set(['npc']),dirty:new Set(),panels:{npc:document.querySelector('[data-panel=npc]')}});g.hud=hud;hud.bindPanelEvents();function render(){hud.renderPanel('npc');document.querySelector('#members').innerHTML=g.party.map(u=>`<div class="member">${avatarMarkup(u.char,'hud')} ${u.char.name} · ${u.char.gender==='female'?'여성':'남성'}</div>`).join('');paintAvatars(document.querySelector('#members'));hud.dirty.clear()}
document.querySelector('#hour').onclick=()=>{hour++;render()};document.querySelector('#poor').onclick=()=>{g.char.gold=99;render()};document.querySelector('#gold').onclick=()=>{g.char.gold=1000;render()};document.querySelector('#reload').onclick=()=>{g.save();g.char=JSON.parse(JSON.stringify(saved));g.party=g.char.party.map((c,i)=>g.makeMercUnit(c,g.player,i));render();document.querySelector('#persist').textContent='재접속 완료 · 저장한 목록과 파티 복원'};render();setInterval(()=>{if(hud.dirty.size)render()},100);
</script></html>
