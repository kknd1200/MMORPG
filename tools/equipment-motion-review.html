<!doctype html><html lang="ko"><meta charset="utf-8"><title>착용 무기 동작 확인</title><style>body{margin:24px;background:#202731;color:#eee;font:15px sans-serif}label{display:inline-block;margin:6px}select,button{padding:8px;background:#333e4d;color:white;border:1px solid #73818b}canvas{background:#36414c;image-rendering:pixelated;border:1px solid #768493;max-width:100%}#strip{display:block;margin-top:14px}p{color:#c5cbd2}</style><h1>착용 무기 동작 확인</h1><p><a style="color:#c9e6ff" href="knight-motion-review.html">기사 전용: 남녀 · 맨손과 착용 상태 나란히 보기</a></p><label>직업 <select id="class"><option value="knight" selected>기사</option><option value="warrior">전사</option><option value="elf">궁수</option><option value="mage">마법사</option><option value="priest">사제</option></select></label><label>성별 <select id="gender"><option value="male">남성</option><option value="female">여성</option></select></label><label>무기 <select id="weapon"></select></label><label>보조 <select id="off"></select></label><label>동작 <select id="action"><option value="idle">대기</option><option value="walk">걷기</option><option value="normal" selected>일반공격</option><option value="skill">스킬공격</option></select></label><label>방향 <select id="dir"></select></label><button id="pause">일시정지</button><p id="info"></p><canvas id="main" width="960" height="400"></canvas><p>아래 8장을 순서대로 재생합니다. 장비를 바꾸면 같은 손 동작에 새 무기를 적용합니다.</p><canvas id="strip" width="1280" height="200"></canvas><script type="module">
import {ITEMS,canEquip} from '../js/data/items.js';import {CHARS,CHAR_ANGLES,CHAR_DIRS,actionDur} from '../js/data/chars.js';import {heroSprite,preloadHeroArt,preloadHeroActions} from '../js/game/hero-sheets.js';import {drawChar} from '../js/game/chars.js';
const $=id=>document.getElementById(id);await preloadHeroArt();let ready=false,paused=false,time=0,last=performance.now();
function state(){return {classId:$('class').value,gender:$('gender').value,level:100,equipment:{weapon:$('weapon').value,shield:$('off').value}};}
async function refresh(){ready=false;const s=state();await preloadHeroActions(s);ready=true;drawStrip();}
function choices(){const cls=$('class').value,all=Object.entries(ITEMS).filter(([id,it])=>canEquip(id,cls,100));$('weapon').innerHTML=all.filter(([,it])=>it.type==='weapon').map(([id,it])=>`<option value="${id}">${it.name}</option>`).join('');$('off').innerHTML='<option value="">미장착</option>'+all.filter(([,it])=>it.slot==='shield').map(([id,it])=>`<option value="${id}">${it.name}</option>`).join('');if(cls==='warrior')$('weapon').value=all.find(([,it])=>it.name==='강철 전투도끼')?.[0] || $('weapon').value;refresh();}
$('dir').innerHTML=CHAR_DIRS.map((name,i)=>`<option value="${i}">${name}</option>`).join('');$('class').onchange=choices;for(const id of ['gender','weapon','off','action','dir'])$(id).onchange=refresh;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'재생':'일시정지';};
function pose(ctx,x,y,t,scale=3,dir=Number($('dir').value)){const s=state(),sprite=heroSprite(s),action=$('action').value,angle=CHAR_ANGLES[dir];drawChar(ctx,x,y,{...s,sprite,scale,facing:{x:Math.cos(angle),y:Math.sin(angle)},act:['normal','skill'].includes(action)?{name:action,t}:null,moving:action==='walk',walk:t*Math.PI*2/.8});}
function drawStrip(){const c=$('strip'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const key=heroSprite(state()),a=$('action').value;for(let f=0;f<8;f++){const t=['normal','skill'].includes(a)?CHARS[key].actions[a].durations.slice(0,f).reduce((n,v)=>n+v,0)/1000+.001:f*.1;pose(ctx,f*160+80,170,t,2);ctx.fillStyle='#eee';ctx.fillText(String(f+1),f*160+5,20);}}
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)time+=dt;const ctx=$('main').getContext('2d');ctx.clearRect(0,0,960,400);if(ready){const key=heroSprite(state()),a=$('action').value,d=actionDur(key,a)||.8,t=time%(d+.28);for(let i=0;i<3;i++)pose(ctx,160+i*320,330,Math.min(t,d-.001),4,(Number($('dir').value)+i*2)%8);$('info').textContent=`${ITEMS[$('weapon').value]?.name || '미장착'} · ${a} · 무기 종류 유지 / 손잡이 고정 / 손가락 앞 표시`; }requestAnimationFrame(tick);}
window.equipmentReview={state,pose,refresh,drawStrip};choices();requestAnimationFrame(tick);
</script></html>
