<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장비창 기능 확인</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#20251e}#hud .panel[data-panel=inv]{display:flex;top:20px;left:20px;right:auto;max-height:calc(100% - 40px)}#hud .panel[data-panel=npc]{display:none}#review-log{position:absolute;bottom:5px;left:20px;color:#cbe0ad}</style><div id="hud"><section class="panel show" data-panel="inv"><header>인벤토리 · 기능 확인</header><div class="body"></div></section><section class="panel" data-panel="npc"><div class="body"></div></section><div class="item-overlay" hidden><section class="item-dialog" role="dialog" aria-modal="true" aria-labelledby="item-detail-title" tabindex="-1"></section></div></div><div id="review-log"></div><script type="module">
import {Hud} from '../js/game/hud.js';
import {Game} from '../js/game/game.js';
const leader={id:'player',isLeader:true,char:{name:'검은바위',classId:'knight',gender:'male',gold:10000,equipment:{weapon:'training_sword',armor:'cloth_armor'},inventory:[{id:'long_sword',qty:1},{id:'chain_mail',qty:1},{id:'red_potion',qty:5},{id:'training_staff',qty:1},{id:'oak_staff',qty:1}]}};
const merc={id:'merc1',char:{name:'엘라',classId:'mage',gender:'female',equipment:{weapon:'training_staff',armor:'cloth_armor'}}};
const game={char:leader.char,selectedId:'player',units:()=>[leader,merc],unitById:id=>[leader,merc].find(u=>u.id===id),selUnit(){return this.unitById(this.selectedId)},log(message){document.querySelector('#review-log').textContent=message},equip:Game.prototype.equip,unequip:Game.prototype.unequip,useItem(id){const e=this.char.inventory.find(e=>e.id===id);if(e&&--e.qty===0)this.char.inventory.splice(this.char.inventory.indexOf(e),1);this.log('소모품 사용: '+id)}};
const hud=Object.create(Hud.prototype);Object.assign(hud,{root:document.querySelector('#hud'),game,open:new Set(['inv']),dirty:new Set(),panels:{inv:document.querySelector('[data-panel=inv]'),npc:document.querySelector('[data-panel=npc]')}});game.hud=hud;hud.bindPanelEvents();hud.renderPanel('inv');setInterval(()=>{if(hud.dirty.has('inv')){hud.dirty.delete('inv');hud.renderPanel('inv')}},100);
</script></html>
